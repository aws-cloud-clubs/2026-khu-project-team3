[project]
name = "backend-batch-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "backend-batch-common",
    "openai>=2.38.0",
    "python-dotenv>=1.2.1",
]

[tool.uv.sources]
backend-batch-common = { path = "../common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]
