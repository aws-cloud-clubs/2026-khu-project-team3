[project]
name = "backend-batch-ohaasa-aggregator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "backend-batch-common",
    "python-dotenv>=1.2.1",
    "requests>=2.34.2",
]

[tool.uv.sources]
backend-batch-common = { path = "../common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ohaasa_aggregator"]
