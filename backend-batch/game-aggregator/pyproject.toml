[project]
name = "backend-batch-game-aggregator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "backend-batch-common",
    "boto3>=1.40.0",
    "playwright>=1.60.0",
    "python-dotenv>=1.2.1",
]

[tool.uv.sources]
backend-batch-common = { path = "../common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/game_aggregator"]
